name: Check and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production changes. Do not interrupt an in-progress deployment.
concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this version
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source and tests
        run: npm run check

      - name: Build and check the website
        run: npm run build

      - name: Explain draft mode
        if: vars.DEPLOY_ENABLED != 'true'
        run: echo "Checks passed. Deployment is off. Follow docs/DEPLOY.md when the owner is ready."

      - name: Check publication readiness
        if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        run: npm run check:publish

      - name: Prevent an old run from overwriting the current site
        if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$GITHUB_SHA" != "$current" ]; then
            echo "::error::This is not the latest main commit. Run the workflow on the latest main."
            exit 1
          fi

      - name: Publish static assets to Cloudflare
        if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN in secrets and CLOUDFLARE_ACCOUNT_ID in variables. See docs/DEPLOY.md."
            exit 1
          fi
          npx --no-install wrangler deploy
